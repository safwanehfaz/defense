<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- First Attempt -->
    <h1>University Registration Form</h1>
    <p>Please fill out the form below to register.</p>
    <hr />
    
    <form>
        <h2>Personal Information</h2>
        
        <label for="fiName">First Name:</label>
        <input type="text" name="userFirstName" id="fiName" placeholder="e.g. Arjun" required>

        <br><br>

        <label for="laName">Last Name:</label>
        <input type="text" name="userLastName" id="laName" placeholder="e.g. Kumar" required>
        
        <br><br>
        
        <label for="date">Date of Birth:</label>
        <input type="date" name="userDOB" id="date" required>

        <br><br>
        
        <label for="gender">Gender:</label>
        <br>
        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male</label>
        <br>
        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female</label>
        <br>
        <input type="radio" name="gender" id="other" value="other">
        <label for="other">Other</label>
        
        <br><br>

        <label for="photo">Upload your photo:</label>
        <br>
        <input type="file" name="userPhoto" id="photo" required>
        
        <br><br>
        <hr />

        <h2>Contact Information</h2>
        
        <label for="email">Email:</label>
        <input type="email" name="userEmail" id="email" placeholder="e.g. your@example.com" required>

        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" name="userPhone" id="phone" placeholder="e.g. 1234567890" required>
        
        <br><br>
        
        <label for="mailaddr">Mailing Address:</label>
        <br>
        <textarea name="userMailingAddress" id="mailaddr" placeholder="Street Address, City, State, Zip Code"></textarea>

        <br><br>
        <hr />

        <h2>Academic Information</h2>

        <label for="course">Select your course:</label>
        <br>
        <select name="userCourse" id="course">
            <option value="CSE">CSE</option>
            <option value="ME">ME</option>
            <option value="CE">CE</option>
        </select>

        <br><br>

        <label>Extra-Curricular Interests:</label>
        <br>
        <input type="checkbox" name="interest" id="sports" value="sports">
        <label for="sports">Sports</label>
        <br>
        <input type="checkbox" name="interest" id="music" value="music">
        <label for="music">Music</label>
        <br>
        <input type="checkbox" name="interest" id="art" value="art">
        <label for="art">Art</label>
        <br>
        <input type="checkbox" name="interest" id="volunteer" value="volunteer">
        <label for="volunteer">Volunteering</label>
        <br>
        <input type="checkbox" name="interest" id="other" value="other">
        <label for="other">Others</label>

        <br><br>
        <hr />

        <h2>Create your account</h2>

        <label for="password">Password:</label>
        <input type="password" name="userPassword" id="password" required>

        <br><br>

        <label for="secq">Security Question:</label>
        <select name="userSecurityQuestion" id="secq">
            <option value="What is your favorite color?">What is your favorite color?</option>
            <option value="What is your favorite movie?">What is your favorite movie?</option>
            <option value="What is your favorite book?">What is your favorite book?</option>
        </select>

        <br><br>

        <label for="secans">Security Answer:</label>
        <input type="text" name="userSecurityAnswer" id="secans" required>

        <br><br>

        <input type="checkbox" name="terms" id="terms" value="accepted" required>
        <label for="terms">I accept the terms and conditions.</label>

        <br><br>
        <hr />

        <button type="submit">Register</button> <button type="reset">Clear Form</button>
    </form>
</body>
</html>
