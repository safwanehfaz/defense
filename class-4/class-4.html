    <meta charset="UTF-8">

<body>
    <form> <!-- v1.2 -->
        <label for="name">Name:</label>
        <input type="text" name="userName" id="name" required>

        <br><br>

        <label for="fname">Father Name:</label>
        <input type="text" name="userFName" id="fname">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" name="userEmail" id="email" required>

        <br><br>

        <label for="age">Age:</label>
        <input type="number" name="userAge" id="age">

        <br><br>

        <label for="pass">Password:</label>
        <input type="password" name="userPass" id="pass" required>

        <br><br>

        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female</label>
        <input type="radio" name="gender" id="pns" value="pns">
        <label for="pns">Prefer not to say</label>

        <br><br>

        <label for="terms"></label>
        <input type="checkbox" name="terms" id="terms" required value="accepted">
        <label for="terms">I agree to the terms and conditions</label>
        <br><br>

        <input type="submit">
    </form>
